spring:
  application:
    name: turfbook-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turfbook}
    username: ${DB_USERNAME:turfbook}
    password: ${DB_PASSWORD:mahemood}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        lob:
          non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:9090}

  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  jwt:
    secret: ${JWT_SECRET:bXlfdHVyZmJvb2tfbG9jYWxfZGV2X3NlY3JldF8zMl9ieXRlcw==}
    access-minutes: 15
    refresh-days: 7

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /api-docs